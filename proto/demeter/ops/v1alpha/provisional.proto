syntax = "proto3";

package demeter.ops.v1alpha;

message RegisterRequest {
  string agent_name = 1;
  optional string agent_version = 2;
  optional string agent_url = 3;
  string client_ip = 4;
}
message RegisterResponse {
  string project_id = 1;
  string project_namespace = 2;
  string api_key = 3;
  string claim_token = 4;
  string user_code = 5;
  string expires_at = 6;
}

service ProvisionalService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}
